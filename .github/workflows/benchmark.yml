name: Run Benchmark Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish report to branch `benchmark-results` using GITHUB_PAT (true/false)'
        required: false
        default: 'false'

jobs:
  run-benchmark:
    name: Run benchmark and upload report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (best-effort)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run benchmark (LOCAL_TEST)
        env:
          LOCAL_TEST: '1'
        run: |
          python evaluation/benchmark_suite.py

      - name: Run collector-mode smoke test
        env:
          LOCAL_TEST: '1'
        run: |
          python tools/collector_test.py

      - name: Upload collector examples artifact
        uses: actions/upload-artifact@v3
        with:
          name: collector-examples
          path: evaluation/reports/collector_examples.json

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-report
          path: evaluation/reports/benchmark_report.json

      - name: Optionally publish report to branch
        if: ${{ inputs.publish == 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          if [ -z "${GITHUB_PAT}" ]; then echo "GITHUB_PAT missing; cannot publish"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b benchmark-results || git checkout benchmark-results
          mkdir -p evaluation/reports
          cp evaluation/reports/benchmark_report.json evaluation/reports/benchmark_report.json
          git add evaluation/reports/benchmark_report.json || true
          git commit -m "Add benchmark report from workflow run" || echo "No changes to commit"
          git push https://${GITHUB_PAT}@github.com/${{ github.repository }} HEAD:benchmark-results --force
