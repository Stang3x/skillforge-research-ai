name: Prometheus Scrape Test

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC
  push:
    paths:
      - 'evaluation/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'evaluation/**'
      - '.github/workflows/**'

jobs:
  test-prometheus-scrape:
    name: Run Prometheus scrape test
    concurrency:
      group: prometheus-scrape-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pip-build
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install optional OpenTelemetry extras
        run: |
          if [ -f requirements-otel.txt ]; then pip install -r requirements-otel.txt || true; fi

      - name: Run Prometheus scrape test (pytest)
        env:
          METRICS_STRICT: '1'
        run: |
          set -e
          python -m pytest evaluation/test_prometheus_scrape.py -q

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-export-ci
          path: |
            evaluation/metrics_export_ci.jsonl
            metrics_export_local_demo.jsonl
